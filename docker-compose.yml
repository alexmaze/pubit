services:
  pubit:
    build: .
    ports:
      - "8080:8080"
    environment:
      PUBIT_LISTEN: ":8080"
      PUBIT_DATA: /data
      PUBIT_BASE_URL: ${PUBIT_BASE_URL:-http://localhost:8080}
      PUBIT_ADMIN_USER: ${PUBIT_ADMIN_USER:-admin}
      PUBIT_ADMIN_PASSWORD: ${PUBIT_ADMIN_PASSWORD:-admin}
      PUBIT_AGENT_TOKEN: ${PUBIT_AGENT_TOKEN:-change-me}
    volumes:
      - pubit-data:/data

volumes:
  pubit-data:
