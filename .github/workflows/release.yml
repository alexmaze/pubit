name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Verify Go build
        run: |
          go vet ./...
          go test ./...
          go build -o /tmp/pubit ./cmd/pubit

      - name: Next version tag
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --force
          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "$existing" ]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "ver=${existing#v}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "ver=${next#v}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:latest
            ${{ steps.img.outputs.repo }}:${{ steps.ver.outputs.tag }}
            ${{ steps.img.outputs.repo }}:${{ steps.ver.outputs.ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.ver.outputs.tag }}" --generate-notes
